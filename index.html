<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCCFA Ref Portal</title>
    <style>
        /* Keeping your excellent, modern football theme layout styling */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #002244; 
            color: white; 
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #001530;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #00bfff;
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #dddddd;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #004488;
            background-color: #002244;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #00bfff;
            outline: none;
        }
        .score-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .score-input {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #002c5c;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 4px solid #00bfff;
        }
        .checkbox-group input {
            width: auto;
            transform: scale(1.3);
        }
        .pin-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #004488;
        }
        .submit-btn {
            width: 100%;
            background-color: #00bfff;
            color: #001530;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }
        .submit-btn:active {
            background-color: #0088cc;
        }
        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #00aa55; color: white; }
        .error { background-color: #cc3333; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BCCFA Ref Portal</h1>
        
        <form id="scoreForm">
            <div class="form-group">
                <label for="gameId">Game ID / Match Number</label>
                <input type="text" id="gameId" placeholder="e.g. 104" required>
            </div>

            <div class="form-group">
                <label for="field">Field Location</label>
                <select id="field" required>
                    <option value="">-- Select Field --</option>
                    <option value="1A">Field 1A</option>
                    <option value="1B">Field 1B</option>
                    <option value="1C">Field 1C</option>
                    <option value="1D">Field 1D</option>
                    <option value="2A">Field 2A</option>
                    <option value="2B">Field 2B</option>
                </select>
            </div>

            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" required>
                    <option value="">-- Select Division --</option>
                    <option value="U10">U10</option>
                    <option value="U12">U12</option>
                    <option value="U14">U14</option>
                </select>
            </div>

            <div class="score-row">
                <div class="form-group">
                    <label for="teamA">Home Team</label>
                    <input type="text" id="teamA" placeholder="Team Name" required>
                </div>
                <div class="form-group" style="max-width: 100px;">
                    <label for="scoreA">Score</label>
                    <input type="number" id="scoreA" class="score-input" min="0" placeholder="0" required>
                </div>
            </div>

            <div class="score-row">
                <div class="form-group">
                    <label for="teamB">Away Team</label>
                    <input type="text" id="teamB" placeholder="Team Name" required>
                </div>
                <div class="form-group" style="max-width: 100px;">
                    <label for="scoreB">Score</label>
                    <input type="number" id="scoreB" class="score-input" min="0" placeholder="0" required>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="coachVerifyA" required>
                <label for="coachVerifyA">Home Coach confirmed score accuracy</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="coachVerifyB" required>
                <label for="coachVerifyB">Away Coach confirmed score accuracy</label>
            </div>

            <div class="form-group pin-section">
                <label for="refPin">Referee Security PIN</label>
                <input type="password" id="refPin" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="Enter 4-Digit PIN" required>
            </div>

            <button type="submit" class="submit-btn">Submit to Commissioner</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Web App's Firebase Configuration (Replace with your actual keys from Firebase Console)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase & Firestore Database
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('scoreForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const pinInput = document.getElementById('refPin').value;
            const gameId = document.getElementById('gameId').value;
            const statusDiv = document.getElementById('statusMessage');
            
            statusDiv.innerText = "Verifying referee credentials...";
            statusDiv.className = "";
            statusDiv.style.display = "block";

            try {
                // Securely check PIN against the database instead of hardcoding it in HTML
                const pinRef = doc(db, "refereePins", pinInput);
                const pinSnap = await getDoc(pinRef);

                if (!pinSnap.exists()) {
                    statusDiv.innerText = "Error: Invalid Referee Security PIN.";
                    statusDiv.className = "error";
                    return;
                }

                statusDiv.innerText = "Transmitting data to real-time database...";

                // Map form values out into our unified Game object scheme
                const gamePayload = {
                    gameId: gameId,
                    field: document.getElementById('field').value,
                    division: document.getElementById('division').value,
                    homeTeam: document.getElementById('teamA').value,
                    homeScore: parseInt(document.getElementById('scoreA').value, 10),
                    awayTeam: document.getElementById('teamB').value,
                    awayScore: parseInt(document.getElementById('scoreB').value, 10),
                    status: "Pending_Commissioner", // Enters the state pipeline
                    lastUpdated: new Date().toISOString(),
                    submittedByRef: pinSnap.data().refName || "Assigned Ref"
                };

                // Push straight to Firestore "games" collection
                await setDoc(doc(db, "games", gameId), gamePayload);

                statusDiv.innerText = "Success! Scores sent to Field Commissioner.";
                statusDiv.className = "success";
                document.getElementById('scoreForm').reset();

            } catch (error) {
                statusDiv.innerText = "Submission failed. Grid network busy.";
                statusDiv.className = "error";
                console.error('Firebase Error:', error);
            }
        });
    </script>
</body>
</html>
